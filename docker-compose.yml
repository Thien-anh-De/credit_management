services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - pipeline_net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - pipeline_net

  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    user: root
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./src:/opt/spark/src
      - ./data:/opt/spark/data
      - ./notebooks:/opt/spark/notebooks
    networks:
      - pipeline_net

  spark-worker:
    image: apache/spark:3.5.1
    container_name: spark-worker
    user: root
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    ports:
      - "8081:8081"
    volumes:
      - ./src:/opt/spark/src
      - ./data:/opt/spark/data
      - ./notebooks:/opt/spark/notebooks
    networks:
      - pipeline_net

  spark-streaming-consumer:
    image: apache/spark:3.5.1
    container_name: spark-streaming-consumer
    user: root
    restart: on-failure
    command: /opt/spark/bin/spark-submit --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1 --master spark://spark-master:7077 /opt/spark/src/streaming_jobs/spark_consumer.py
    depends_on:
      - spark-master
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=transactions_topic
      - IVY_HOME=/tmp/.ivy2
    volumes:
      - ./src:/opt/spark/src
      - ./data:/opt/spark/data
    networks:
      - pipeline_net

  spark-batch-users:
    image: apache/spark:3.5.1
    container_name: spark-batch-users
    user: root
    command: /opt/spark/bin/spark-submit --master "local[*]" /opt/spark/src/batch_jobs/process_users.py
    depends_on:
      - spark-master
    volumes:
      - ./src:/opt/spark/src
      - ./data:/opt/spark/data
    networks:
      - pipeline_net

  spark-batch-cards:
    image: apache/spark:3.5.1
    container_name: spark-batch-cards
    user: root
    command: /opt/spark/bin/spark-submit --master "local[*]" /opt/spark/src/batch_jobs/process_cards.py
    depends_on:
      - spark-master
    volumes:
      - ./src:/opt/spark/src
      - ./data:/opt/spark/data
    networks:
      - pipeline_net

  kafka-producer:
    image: apache/spark:3.5.1
    container_name: kafka-producer
    user: root
    restart: on-failure
    command: >
      bash -c "
      pip install kafka-python-ng &&
      python3 /opt/spark/src/streaming_jobs/kafka_producer.py --bootstrap-servers kafka:9092 --continuous --batch-delay 0.05 --log-every 10
      "
    depends_on:
      - kafka
      - spark-streaming-consumer
    volumes:
      - ./src:/opt/spark/src
      - ./data:/opt/spark/data
    networks:
      - pipeline_net

  web-dashboard:
    image: apache/spark:3.5.1
    container_name: web-dashboard
    user: root
    restart: on-failure
    command: >
      bash -c "
      pip install streamlit plotly pyarrow pandas &&
      python3 -m streamlit run /opt/spark/src/web_dashboard.py --server.port=8501 --server.address=0.0.0.0
      "
    ports:
      - "8501:8501"
    depends_on:
      - spark-streaming-consumer
    volumes:
      - ./src:/opt/spark/src
      - ./data:/opt/spark/data
    networks:
      - pipeline_net

networks:
  pipeline_net:
    driver: bridge
